name: Library upstream verification
on:
  push:
    branches: [fix/multi-source-islamic-library-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public library endpoints
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
              "https://api.islamic.app/v1/library/books?limit=2",
              "https://islamic.app/api/library/books?limit=2",
              "https://propheticsciences.com/api/v1/works?perPage=2&page=1",
              "https://propheticsciences.com/api/v1/categories",
          ]
          for url in urls:
              print("\nSOURCE:", url, flush=True)
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "DhuAlJalalLibraryProbe/1.0", "Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      body = response.read(12000)
                      print("STATUS:", response.status, "TYPE:", response.headers.get("content-type"))
                  try:
                      obj = json.loads(body)
                      if isinstance(obj, dict):
                          print("ROOT KEYS:", list(obj.keys())[:18])
                          for k in ("data", "works", "results", "items", "pagination", "meta", "total"):
                              if k in obj:
                                  v = obj[k]
                                  print(k, "TYPE:", type(v).__name__, "PREVIEW:", json.dumps(v, ensure_ascii=False)[:1500])
                      elif isinstance(obj, list):
                          print("ARRAY:", len(obj), json.dumps(obj[:1], ensure_ascii=False)[:1500])
                  except (ValueError, UnicodeDecodeError):
                      print("Not JSON; first bytes:", repr(body[:150]))
              except Exception as exc:
                  print("FAILED:", type(exc).__name__, str(exc)[:300])
          PY
