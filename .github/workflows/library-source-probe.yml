name: Populate public library snapshot
on:
  push:
    branches: [fix/multi-source-islamic-library-20261103]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-source-islamic-library-20261103
          persist-credentials: true
      - name: Capture verified Islamic App public metadata
        run: |
          python3 - <<'PY'
          import json, urllib.request, time, os
          from datetime import datetime, timezone
          catalog, offset, total, limit = [], 0, None, 100
          while total is None or offset < total:
              url = f"https://api.islamic.app/v1/library/books?limit={limit}&offset={offset}"
              payload = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "DhuAlJalalCatalogSnapshot/1.0"})
                      with urllib.request.urlopen(req, timeout=16) as response:
                          if response.status != 200: raise ValueError(f"HTTP {response.status}")
                          payload = json.load(response)
                      break
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2 * (attempt + 1))
              data = payload.get("data", payload)
              items = data.get("books")
              if not isinstance(items, list): raise ValueError("Missing books array")
              if total is None: total = int(data["total"])
              for item in items:
                  if not isinstance(item, dict): continue
                  slug, title = item.get("slug"), item.get("title_ar")
                  if not slug or not title: continue
                  catalog.append([slug, title, item.get("author_name_ar") or "", item.get("genre") or "general", bool(item.get("has_pdf")), bool(item.get("has_text")), bool(item.get("has_chapters"))])
              offset += len(items)
              print("Fetched", offset, "/", total, flush=True)
              if not items: break
              time.sleep(.2)
          if len(catalog) < 100: raise ValueError(f"Too few books: {len(catalog)}")
          obj = {"source": "Islamic App Classical Library", "sourceUrl": "https://islamic.app/library", "capturedAt": datetime.now(timezone.utc).isoformat(), "total": total, "books": catalog}
          os.makedirs("src/data/library", exist_ok=True)
          with open("src/data/library/islamic-app-catalog.json", "w", encoding="utf-8") as f:
              json.dump(obj, f, ensure_ascii=False, separators=(",", ":"))
          print("CAPTURED_BOOKS=", len(catalog), "REPORTED_TOTAL=", total)
          PY
      - name: Commit static catalog to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/library/islamic-app-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "data: snapshot verified public Islamic App catalog for offline fallback"
            git push origin HEAD:fix/multi-source-islamic-library-20261103
          fi
